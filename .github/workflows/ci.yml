name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  templates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: [getting-started, html, json-api, empty]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: templates/${{ matrix.template }}
      - run: ./templates/check-manifests.sh
      - run: cargo clippy --manifest-path templates/${{ matrix.template }}/Cargo.toml

  impit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/crawlee-impit
    env:
      # Overrides the job-wide flags, so the cfg from .cargo/config.toml has to be repeated.
      RUSTFLAGS: -D warnings --cfg reqwest_unstable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integrations/crawlee-impit
      - run: cargo fmt --check
      # Not `--locked`: new dependencies of the main crates are added to the lockfile, while
      # its existing entries (the hyper, reqwest and h2 versions matching the forks) are kept.
      - run: cargo clippy --all-targets
      - run: cargo test
      - name: The patched h2 is used
        run: cargo tree -i h2 --edges normal | head -1 | grep -q "github.com/apify/h2"
